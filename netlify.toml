# Hide .html in URL bar — anyone (Google, bookmarks, old links) hitting
# /foo.html gets 301-redirected to /foo. Belt-and-suspenders alongside
# pretty_urls in case the build-processing flag is silently disabled.
[[redirects]]
  from   = "/*.html"
  to     = "/:splat"
  status = 301
  force  = true

# ── Pre-rendered language variants ─────────────────────────────────
# When ?lang=pt-BR is present, serve the pre-rendered <page>.pt.html so
# crawlers see the Portuguese title/description/og:* in the raw HTML
# (instead of having to execute i18n.js to swap them client-side).
# status=200 is an INTERNAL rewrite — the URL stays /?lang=pt-BR so the
# canonical / hreflang stays consistent.
# force=true so the rewrite wins over the static EN file at the same path.
# Generated by build-i18n.js; sources stay as the EN/default variant.
[[redirects]]
  from   = "/"
  to     = "/index.pt.html"
  status = 200
  force  = true
  query  = { lang = "pt-BR" }

[[redirects]]
  from   = "/periodic-table"
  to     = "/periodic-table.pt.html"
  status = 200
  force  = true
  query  = { lang = "pt-BR" }

[[redirects]]
