# The periodic-table HUB itself (EN-default data-i18n page) for ?lang=en.
# MUST come before the element wildcard below: otherwise `/periodic-table?lang=en`
# is captured by `/periodic-table/*` and rewritten to `/periodic-table/.en.html`
# (empty splat) — a file that doesn't exist → 404. Serve the source HTML instead.
[[redirects]]
  from   = "/periodic-table"
  to     = "/periodic-table.html"
  status = 200
  force  = true
  query  = { lang = "en" }

# Element pages — EN variant (sources are PT-default). The splat captures
# the latin slug (e.g. "hydrogenium" → /periodic-table/hydrogenium.en.html).
# Pretty URLs keep this internal: the user-visible URL stays /periodic-table/hydrogenium?lang=en.
[[redirects]]
  from   = "/periodic-table/*"
  to     = "/periodic-table/:splat.en.html"
  status = 200
  force  = true
  query  = { lang = "en" }

# ── Accept-Language auto-serve (PT) ────────────────────────────────
# First-time visitor lands on the clean root URL `/` with a Portuguese
# browser → INTERNAL 200 rewrite serves the pre-rendered /index.pt.html
# directly. End result: zero flash of English content for Brazilian
# visitors typing atomurus.com, with no extra redirect round-trip.
# (This used to be a 302 to /?lang=pt-BR — same end state, but it cost
# Brazilian first-time visitors one full round-trip before the HTML,
# and a separate CDN cache variant. Lighthouse TTFB flagged it.)
#
# Body content is identical between index.html and index.pt.html (only
# head meta differs) — the inline FOUC script + i18n.js still resolve
# the user's language client-side from localStorage/navigator, so a
# returning user who explicitly chose EN keeps EN.
#
# Ordering: the explicit `query = { lang = "pt-BR" }` rule above matches
# /?lang=pt-BR first; this conditional rule only fires for the plain `/`.
# force=true so the rewrite wins over the static index.html at `/`.
#
# Why only `/` and not every page: internal navigation after the first
# visit inherits language from localStorage via the inline FOUC script
# in each HTML head (the `lang-pt-pending` class), so subsequent pages
# don't flash. Deep-linking into /about etc. is rare without query already.
[[redirects]]
  from       = "/"
  to         = "/index.pt.html"
  status     = 200
  force      = true
  conditions = { Language = ["pt"] }

# ── Cache strategy ──────────────────────────────────────────────────
# HTML: revalidate on every request (so users always see latest version).
# Assets (CSS/JS/img): 1-year + immutable (CDN never re-checks until file
# is renamed or query-busted). Multiplies free-tier bandwidth capacity.

# ── Security headers (apply globally to every response) ────────────────
# Addresses OWASP ZAP findings: CSP, X-Frame-Options, X-Content-Type-Options,
# Referrer-Policy, Permissions-Policy. SRI for external scripts is handled
# in HTML where applicable (Google Fonts CSS doesn't accept SRI hashes
# because the file changes per User-Agent).
[[headers]]
  for = "/*"
  [headers.values]
    # CSP — allow our own assets + Google services we explicitly use.
    # 'unsafe-inline' on script-src is required because the site uses
    # inline <script> for theme/lang bootstrapping and gtag init.
    # AdCash (acscdn.com) loads lazily via ads-gate.js — must be allowed here or Pro-monetization breaks for free users.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://www.googletagmanager.com https://www.googletagservices.com https://www.google-analytics.com https://www.google.com https://www.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://acscdn.com https://ep1.adtrafficquality.google https://ep2.adtrafficquality.google; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://pagead2.googlesyndication.com https://acscdn.com https://ep1.adtrafficquality.google https://ep2.adtrafficquality.google https://googleads.g.doubleclick.net https://stats.g.doubleclick.net; frame-src 'self' https://www.google.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://ep1.adtrafficquality.google https://ep2.adtrafficquality.google https://www.youtube.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
    # Clickjacking — only this origin can frame us (matches CSP frame-ancestors)
    X-Frame-Options = "SAMEORIGIN"
    # Disable MIME-sniffing
    X-Content-Type-Options = "nosniff"
    # HTTPS-only in production. No preload yet, so future subdomain choices stay flexible.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Only send the origin (not the full URL) when navigating to other sites
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Block features we don't use
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Auth pages and API responses may reveal account state, so do not cache them.
[[headers]]
  for = "/login"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/signup"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/forgot-password"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/reset-password"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/login/reset"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/app"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

# HTML — always revalidate
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Wildcard static assets — 1 year, immutable. To bust, append ?v=N or
# rename the file. Browser will NOT make a conditional request.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Named bundles in root — explicit so they don't accidentally inherit
# something weaker. Same 1-year + immutable policy.
[[headers]]
  for = "/elements-data.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/periodic-table.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/periodic-table.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cookie-consent.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/recaptcha.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/atomurus-lab-console.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# PWA manifest — short cache (occasionally updated)
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json; charset=utf-8"

# robots / sitemap — short-medium cache (occasionally regenerated)
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
