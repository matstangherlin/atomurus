# ───────────────────────────────────────────────────────────────────
# Atomurus — Netlify configuration
# ───────────────────────────────────────────────────────────────────
# REQUIRED ENVIRONMENT VARIABLES (set in Netlify dashboard):
#   RECAPTCHA_SECRET_KEY = <secret key from reCAPTCHA admin console>
#   MAILGUN_API_KEY      = <private Mailgun API key>   # contact form — NEVER in client code
#   MAILGUN_DOMAIN       = sandboxXXXX.mailgun.org      # or mg.atomurus.com (verified domain)
#   CONTACT_TO           = contato@atomurus.com         # inbox that receives form messages
#   SUPABASE_URL         = https://<project>.supabase.co
#   SUPABASE_ANON_KEY    = <supabase anon key>
#   SUPABASE_FETCH_TIMEOUT_MS = 8000  # optional: abort hung GoTrue body reads
#
# OPTIONAL ENVIRONMENT VARIABLES:
#   SUPABASE_SERVICE_ROLE_KEY = <supabase service role key> # server-only: username lookup, billing metadata
#   AUTH_SITE_URL        = https://atomurus.com
#   ALLOWED_ORIGIN       = https://atomurus.com   # lock CORS to your domain
#   AUTH_ALLOWED_ORIGINS = https://atomurus.com,https://www.atomurus.com
#   AUTH_PASSWORD_REDIRECT = https://atomurus.com/reset-password
#   STRIPE_SECRET_KEY    = sk_live_...
#   STRIPE_WEBHOOK_SECRET = whsec_...
#   STRIPE_PRICE_MONTHLY_BRL = price_...
#   STRIPE_PRICE_ANNUAL_BRL  = price_...
#   STRIPE_PRICE_MONTHLY_USD = price_...
#   STRIPE_PRICE_ANNUAL_USD  = price_...
#   MAILGUN_BASE_URL     = https://api.mailgun.net # US (default) | https://api.eu.mailgun.net (EU)
#   CONTACT_FROM         = Atomurus <postmaster@MAILGUN_DOMAIN>   # custom From header
#   RECAPTCHA_MIN_SCORE  = 0.5                     # contact-send spam threshold
# See MAILGUN-SETUP.md for the full walkthrough.
# ───────────────────────────────────────────────────────────────────

[build]
  publish      = "."
  functions    = "netlify/functions"
  edge_functions = "netlify/edge-functions"
  command      = "npm run build && npm run validate && node tools/scrub-publish-tree.js"

# Hide .html in URLs — /periodic-table/aurum serves periodic-table/aurum.html,
# and /periodic-table/aurum.html is 301'd to /periodic-table/aurum.
# Applies site-wide (about, contact, privacy, terms, etc. all benefit too).
[build.processing.html]
  pretty_urls = true

[functions]
  node_bundler = "esbuild"
  included_files = ["elements-data.js", "assets/i18n/molecules.json"]

# Unsigned /app never receives app.html. Cookie presence is the only check
# here; stale atm_* cookies still fall through to /api/auth/me in the browser.
[[edge_functions]]
  path = "/app"
  function = "protect-app"

[[edge_functions]]
  path = "/app.html"
  function = "protect-app"

[[edge_functions]]
  path = "/app/*"
  function = "protect-app"

# Pretty URL for the reCAPTCHA verifier:
#   POST /api/recaptcha-verify  →  /.netlify/functions/recaptcha-verify
[[redirects]]
  from   = "/api/recaptcha-verify"
  to     = "/.netlify/functions/recaptcha-verify"
  status = 200

# Pretty URL for the contact-form email sender (Mailgun):
#   POST /api/contact-send  →  /.netlify/functions/contact-send
[[redirects]]
  from   = "/api/contact-send"
  to     = "/.netlify/functions/contact-send"
  status = 200

