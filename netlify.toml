# Periodic-table sub-views (heatmap/trends/compare/isotopes) are EN-default
# data-i18n pages — for ?lang=en they should serve the source HTML, NOT be
# captured by the element wildcard below. These explicit rules short-circuit.
[[redirects]]
  from   = "/periodic-table/heatmap"
  to     = "/periodic-table/heatmap.html"
  status = 200
  force  = true
  query  = { lang = "en" }

[[redirects]]
  from   = "/periodic-table/trends"
  to     = "/periodic-table/trends.html"
  status = 200
  force  = true
  query  = { lang = "en" }

[[redirects]]
