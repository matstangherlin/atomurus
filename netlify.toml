  from   = "/periodic-table/isotopes"
  to     = "/periodic-table/isotopes.html"
  status = 200
  force  = true
  query  = { lang = "en" }

# The periodic-table HUB itself (EN-default data-i18n page) for ?lang=en.
# MUST come before the element wildcard below: otherwise `/periodic-table?lang=en`
# is captured by `/periodic-table/*` and rewritten to `/periodic-table/.en.html`
# (empty splat) — a file that doesn't exist → 404. Serve the source HTML instead.
[[redirects]]
  from   = "/periodic-table"
  to     = "/periodic-table.html"
  status = 200
  force  = true
  query  = { lang = "en" }

# Element pages — EN variant (sources are PT-default). The splat captures
# the latin slug (e.g. "hydrogenium" → /periodic-table/hydrogenium.en.html).
# Pretty URLs keep this internal: the user-visible URL stays /periodic-table/hydrogenium?lang=en.
[[redirects]]
  from   = "/periodic-table/*"
  to     = "/periodic-table/:splat.en.html"
  status = 200
  force  = true
  query  = { lang = "en" }

# ── Accept-Language auto-serve (PT) ────────────────────────────────
# First-time visitor lands on the clean root URL `/` with a Portuguese
# browser → INTERNAL 200 rewrite serves the pre-rendered /index.pt.html
# directly. End result: zero flash of English content for Brazilian
# visitors typing atomurus.com, with no extra redirect round-trip.
# (This used to be a 302 to /?lang=pt-BR — same end state, but it cost
# Brazilian first-time visitors one full round-trip before the HTML,
# and a separate CDN cache variant. Lighthouse TTFB flagged it.)
#
# Body content is identical between index.html and index.pt.html (only
# head meta differs) — the inline FOUC script + i18n.js still resolve
# the user's language client-side from localStorage/navigator, so a
# returning user who explicitly chose EN keeps EN.
#
# Ordering: the explicit `query = { lang = "pt-BR" }` rule above matches
# /?lang=pt-BR first; this conditional rule only fires for the plain `/`.
# force=true so the rewrite wins over the static index.html at `/`.
#
# Why only `/` and not every page: internal navigation after the first
# visit inherits language from localStorage via the inline FOUC script
# in each HTML head (English fallbacks stay visible until i18n.js applies),
# so subsequent pages don't go blank. Deep-linking into /about etc. is rare
# without a query already.
[[redirects]]
  from       = "/"
  to         = "/index.pt.html"
  status     = 200
  force      = true
  conditions = { Language = ["pt"] }

# ── Cache strategy ──────────────────────────────────────────────────
# HTML: revalidate on every request (so users always see latest version).
# Assets (CSS/JS/img): 1-year + immutable (CDN never re-checks until file
# is renamed or query-busted). Multiplies free-tier bandwidth capacity.

# ── Security headers (apply globally to every response) ────────────────
# Addresses OWASP ZAP findings: CSP, X-Frame-Options, X-Content-Type-Options,
# Referrer-Policy, Permissions-Policy. SRI for external scripts is handled
# in HTML where applicable (Google Fonts CSS doesn't accept SRI hashes
# because the file changes per User-Agent).
[[headers]]
  for = "/*"
  [headers.values]
    # CSP, stage 1 (applied). Built by `node tools/audit-csp.mjs --emit-policy`;
    # tools/test-audit-csp.mjs fails if this line and the script drift.
    # 'unsafe-inline' stays on script-src for now: 171 distinct inline scripts
    # (theme/lang bootstrap, loading class, page code) and 1,490 on*= handlers.
    # docs/security/csp-plano.md is the way out; stage 3 is the owner's call.
    # Origins, by purpose (nothing is requested before consent, prompt 04):
    #   GA4, after measurement consent (lazy-ads.js): script *.googletagmanager.com;
    #     connect *.google-analytics.com, *.analytics.google.com, *.googletagmanager.com
    #     (g/collect goes to the regional hosts; the old list only had www.google-analytics.com).
    #   reCAPTCHA on /contact (recaptcha.js): script www.google.com + www.gstatic.com;
    #     connect www.google.com/recaptcha/ (api2/clr was blocked); frame www.google.com +
    #     recaptcha.google.com/recaptcha/.
    #   Ads, after ads consent and only for plans with ads (ads-gate.js): AdSense
    #     (pagead2/tpc.googlesyndication, googletagservices, doubleclick, adtrafficquality)
    #     and AdCash (acscdn.com). If the owner turns ads off, these can go.
    #   Libraries: cdn.jsdelivr.net (Chart.js on the trends pages), cdnjs.cloudflare.com
    #     (Three.js r128, html2canvas, jsPDF).
    # Removed: fonts.googleapis.com / fonts.gstatic.com and www.youtube.com, which no
    # published page loads, and www.google-analytics.com in script-src (GA4 has no
    # script there).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.googletagmanager.com https://www.google.com https://www.gstatic.com https://pagead2.googlesyndication.com https://www.googletagservices.com https://acscdn.com https://ep1.adtrafficquality.google https://ep2.adtrafficquality.google https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.google.com/recaptcha/ https://pagead2.googlesyndication.com https://acscdn.com https://ep1.adtrafficquality.google https://ep2.adtrafficquality.google https://googleads.g.doubleclick.net https://stats.g.doubleclick.net; frame-src 'self' https://www.google.com https://recaptcha.google.com/recaptcha/ https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://ep1.adtrafficquality.google https://ep2.adtrafficquality.google; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
    # CSP, stage 2 (Report-Only: reports, never blocks). Built by
    # `node tools/audit-csp.mjs --emit-report-only`. No 'unsafe-inline' and
    # script-src-attr 'none': the 55 most repeated inline scripts are allowed by
    # hash (the header stays under 4 KiB); the other 116 and every on*= handler
    # show up as violations in the browser console. No report-uri / report-to:
    # an endpoint is the owner's decision. Work list: docs/security/csp-plano.md.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'report-sample' 'sha256-Aaiofhy819IsUKQmSjRaFre4MLieUINTMVTKQ6tH6ns=' 'sha256-Od4vphTIx8VzgCm58ysCiXIDV2ODMVmnKPxbmgZ3SpE=' 'sha256-f3FuP1ud9GH45W2Iec/tobDEAsQ0Rtr2FIgj7T6AkYg=' 'sha256-PL7BJuyyFcjJFR0L+guhNJrGyy/ReBH1c7pV/VvS0zo=' 'sha256-ULJY4DKV3WqAj6DsguVL1Bxt+P4dvLF/IaPDU6s38jU=' 'sha256-xHY5CHbSXXjPeNbyLTDpboJPLQtmWzR2n7hI2uTypLk=' 'sha256-L1xzaNTyOkCVGahZTluM+nn7P+pIZvqQnKnjITqJMn8=' 'sha256-AFr8y2RkwTdxn/jTB+7+28oS3itsLdBn/qpOq3tkFxg=' 'sha256-YqQhGW8jXzNNBhVyS35tkH5jwBK5pjyelH6KLe/rOVY=' 'sha256-4hzkJ9B2exDnVFpT8NSzNFkBY1E+tVViQr4nsESzprM=' 'sha256-eneonJ9+uEDfZcPeIbJ0QP/Swsjoa0jJgXfkQB4SMnE=' 'sha256-gF3iftwDK0uKLwZoz3U8vRdKPaxAVLPjYxwoLcv8adY=' 'sha256-6n/kR2Bfe5+bt5WPDb3vMmHopoJJCYiYltX+3Ywfip4=' 'sha256-/Rz/7LZ1fa3Rp8UbG6nxTz6pFVAdVgBzcZwJVDj7JcI=' 'sha256-+hNhZjUfVAwCoGPHH6ppmz6i4tQ9DzsmuQTCfExJvis=' 'sha256-+nn2htX5aglfx0r+Hr/JCese8p+wl9f+0wJ5gXjZe/A=' 'sha256-08MTPMViTr1JkPc+eIF3dSgPXIUb+tMS6AN6Vm11dcc=' 'sha256-0I0CIqnb1itlz/y0AgLc9RuQKiVWQcrnzRQK3g9mNGg=' 'sha256-0v7ytiBTge8ycHQfYbbOfnn29HSPE/+gukVMWPhqkow=' 'sha256-0YmKIgcmzCU3TItycIAVKLNi69caaSEqHE4G4ep54Ls=' 'sha256-1h/9NtGb7RS/LnFCrqdTt/DbVG6WV7CeVUYqNRURBXQ=' 'sha256-1K54gca8trMZsOHZjp9THYgHJOwhrjq4bVHbVu88Zqk=' 'sha256-1N85WcUu/h3MTAQFRqIqRx9EzRilkcr5rSI5LY6hI+g=' 'sha256-2aNpjJpiQPBLvj8K8LKiZ98XGxmxtNllIfIc74AiNhc=' 'sha256-30w10ZHQJ17JtYrLOUDWWleHZuIm9T6FEqSjlU20IZc=' 'sha256-3eBtFrymF14s3jDwKtSTOKJSfACijZY9ouhhp/+8rPw=' 'sha256-3Q9rOGohasuZoRbrxGYcMRTy+VcgIPpDtNPLOxSMxbE=' 'sha256-4H/1t0ArYwqHzPVjulnEMEfoMZwq8PEyjeK99utcKZc=' 'sha256-592DTzO9RGzxnGSFR10UGHZOu+2XArn7EF6CKUSGvSg=' 'sha256-6wE2je/8YNt77mqq7R+KQX7Ed0+6EDORmqFXpLKQAkE=' 'sha256-7Jwx95LGMzGsiwulQx8xRl9P5wqeFWsA/JD4CCQqZWg=' 'sha256-8fZ3tJ2TgLACcLte1wuQduHgrzZ3v0xzk901KryuzPI=' 'sha256-8I/bx2OnjEy+6yqLDzDGX6hdrd1nMn9WExTikFonsf8=' 'sha256-8JdQQG4siuIlwbrHaZfGgBC45d2W0FofeT1JIEgf1hU=' 'sha256-8V0eDfsgZek0Sxr+Ivviqm4VkED+WRFYvW28AUh4H5A=' 'sha256-9/An6