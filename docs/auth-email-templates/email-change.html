<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Confirme o novo e-mail na Atomurus</title>
</head>
<body>
  <p>Olá,</p>
  <p>Confirme {{ .NewEmail }} como o novo e-mail da sua conta Atomurus.</p>
  <p><a href="{{ .SiteURL }}/login?token_hash={{ .TokenHash }}&amp;type=email_change">Confirmar novo e-mail</a></p>
  <p>Se você não pediu esta troca, ignore esta mensagem e escreva para contato@atomurus.com.</p>
  <p>Atomurus · <a href="mailto:contato@atomurus.com">contato@atomurus.com</a></p>
</body>
</html>
