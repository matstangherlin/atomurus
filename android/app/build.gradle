apply plugin: 'com.android.application'

/* Release signing (Play upload key). Read from android/keystore.properties
   (never committed) or from environment variables in CI:
     ATOMURUS_KEYSTORE_FILE, ATOMURUS_KEYSTORE_PASSWORD,
     ATOMURUS_KEY_ALIAS, ATOMURUS_KEY_PASSWORD
   Without them, release builds are produced unsigned. */
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String prop, String env -> System.getenv(env) ?: keystoreProps.getProperty(prop) }
def releaseStoreFile = signingValue('storeFile', 'ATOMURUS_KEYSTORE_FILE')
def hasReleaseKey = releaseStoreFile && rootProject.file(releaseStoreFile).exists()

/* Version: android/gradle.properties (atomurusVersionCode / atomurusVersionName),
   overridable with ATOMURUS_VERSION_CODE / ATOMURUS_VERSION_NAME.
   Every upload to Google Play needs a higher versionCode. */
def appVersionCode = (System.getenv('ATOMURUS_VERSION_CODE') ?: project.findProperty('atomurusVersionCode') ?: '1') as Integer
def appVersionName = System.getenv('ATOMURUS_VERSION_NAME') ?: project.findProperty('atomurusVersionName') ?: '1.0.0'

android {
    // Java/Kotlin namespace (code only). The Play package is applicationId below.
    namespace = "com.atomurus"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "atomurus.com"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword signingValue('storePassword', 'ATOMURUS_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'ATOMURUS_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'ATOMURUS_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // R8: shrink + optimise + obfuscate the Java/Kotlin code (Play Console
            // "DEX code optimisation"). Capacitor ships its own keep rules
            // (consumerProguardFiles), so plugins keep working.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
