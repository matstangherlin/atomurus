name: Warm Edge Cache

# After main deploys, ping the hottest public URLs so Netlify edge nodes
# are hot for the first real visitors (especially BR). No Netlify login
# required — uses public HTTPS GETs.
#
# Optional: set repo variable ATOMURUS_SITE_URL if the production host changes.

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for Netlify deploy
        run: sleep 90

      - name: Warm production edge cache
        env:
          ATOMURUS_SITE_URL: ${{ vars.ATOMURUS_SITE_URL }}
        run: node tools/warm-edge-cache.js
