name: Site Quality

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build generated artifacts
        run: npm run build

      - name: Run unit tests
        run: npm run test:plan && npm run test:auth && npm run test:study && npm run test:review && npm run test:insights && npm run test:billing && npm run test:ux && npm run test:lang && npm run test:editorial && npm run test:consent && npm run test:content && npm run test:data && npm run test:pro-lab && npm run test:solver && npm run test:calc && npm run test:sci && npm run test:lab-access && npm run test:molecules && npm run test:publish && npm run test:contact && npm run test:rate-store && npm run test:third-party && npm run test:images && npm run test:csp-audit && npm run test:a11y && npm run test:pt-split && npm run test:isotopes && npm run test:404 && npm run test:lang-mix && npm run test:sheets && npm run test:articles && node tools/test-periodic-search.mjs

      - name: Validate site
        run: npm run validate
