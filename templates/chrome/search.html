<form class="ps-search search-box" role="search" action="{{prefix}}periodic-table.html" method="get">
  <label class="lc-sr-only" for="ps-search-q">Search element</label>
  <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
    <circle cx="5.5" cy="5.5" r="4" stroke="currentColor" stroke-width="1.4"/>
    <line x1="8.7" y1="8.7" x2="11.5" y2="11.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  </svg>
  <input id="ps-search-q" name="q" type="search" autocomplete="off" data-i18n-attr="placeholder:common.searchPlaceholder" placeholder="search element, symbol or Z…">
  <button type="submit" data-i18n-attr="aria-label:common.searchAria" aria-label="Search element">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
      <circle cx="6" cy="6" r="4.2" stroke="currentColor" stroke-width="1.3"/>
      <path d="M9.2 9.2 12 12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
  </button>
</form>
